name: Build and publish ZergLang IDE

on:
  push:
    branches:
      - main
    paths:
      - "requests/*.json"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: preview
        options:
          - preview
          - stable
      version:
        description: Strict SemVer without a v prefix
        type: string
        required: true
      source_sha:
        description: Exact 40-character Epoch-ML/zerg commit SHA
        type: string
        required: true

concurrency:
  # Both workflows commit and deploy the same Pages tree. This lock prevents a
  # verified updater manifest and a benchmark index from racing each other.
  group: zerglang-publication
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.request.outputs.channel }}
      release_tag: ${{ steps.request.outputs.release_tag }}
      requested_at: ${{ steps.request.outputs.requested_at }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Test the request policy
        run: node --test scripts/release-request.test.mjs

      - id: request
        name: Resolve and validate exactly one request
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          request_path="$RUNNER_TEMP/release-request.json"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              mapfile -t changed_files < <(
                git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA"
              )
            else
              mapfile -t changed_files < <(
                git diff --name-only --no-renames "$before" "$GITHUB_SHA"
              )
            fi
            if [[ ${#changed_files[@]} -ne 1 ]]; then
              echo "::error::a release push must change exactly one file; found ${#changed_files[@]}"
              exit 1
            fi
            candidate="${changed_files[0]}"
            if [[ ! "$candidate" =~ ^requests/[0-9A-Za-z._+-]+\.json$ || ! -f "$candidate" ]]; then
              echo "::error::the only changed file must be one requests/*.json file"
              exit 1
            fi
            node scripts/release-request.mjs "$candidate" >"$request_path"
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::manual release recovery must run from the releases repository main branch"
              exit 1
            fi
            if [[ "$INPUT_CHANNEL" == "stable" ]]; then
              release_tag="zerglang-ide-v${INPUT_VERSION}"
            else
              release_tag="zerglang-ide-preview-v${INPUT_VERSION}"
            fi
            requested_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
            jq -n \
              --arg channel "$INPUT_CHANNEL" \
              --arg version "$INPUT_VERSION" \
              --arg release_tag "$release_tag" \
              --arg source_sha "$INPUT_SOURCE_SHA" \
              --arg source_ref "refs/tags/$release_tag" \
              --arg requested_at "$requested_at" \
              '{
                schema_version: 1,
                product: "ZergLang IDE",
                channel: $channel,
                version: $version,
                release_tag: $release_tag,
                source_repository: "Epoch-ML/zerg",
                source_sha: $source_sha,
                source_ref: $source_ref,
                requested_at: $requested_at
              }' >"$RUNNER_TEMP/manual-request.json"
            node scripts/release-request.mjs \
              "$RUNNER_TEMP/manual-request.json" >"$request_path"
          fi

          release_tag="$(jq -r .release_tag "$request_path")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "${changed_files[0]}" != "requests/${release_tag}.json" ]]; then
              echo "::error::request filename must be requests/${release_tag}.json"
              exit 1
            fi
          fi

          for field in channel release_tag requested_at source_ref source_sha version; do
            printf '%s=%s\n' "$field" "$(jq -r ".$field" "$request_path")" \
              >>"$GITHUB_OUTPUT"
          done

  build:
    name: Build Apple Silicon release
    needs: validate
    runs-on: macos-15
    environment: ${{ needs.validate.outputs.channel }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      HOMEBREW_NO_AUTO_UPDATE: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      RUST_TOOLCHAIN: "1.88.0"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ZERGLANG_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ZERGLANG_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_ZERGLANG_UPDATER_ENABLED: "true"
      ZERGLANG_IDE_VERSION: ${{ needs.validate.outputs.version }}
      ZERGLANG_RELEASE_DATE: ${{ needs.validate.outputs.requested_at }}
      ZERGLANG_RELEASE_REPOSITORY: ${{ github.repository }}
      ZERGLANG_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      ZERGLANG_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      ZERGLANG_UPDATE_BASE_URL: https://epoch-ml.github.io/zerglang-releases
      ZERGLANG_UPDATE_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - name: Require release credentials
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.ZERG_SOURCE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]] || {
            echo "::error::the release runner must be Apple Silicon"
            exit 1
          }
          for variable_name in \
            SOURCE_DEPLOY_KEY \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::required release secret is unavailable: $variable_name"
              exit 1
            fi
          done

      - name: Check out the exact source commit and tag
        env:
          EXPECTED_REF: ${{ needs.validate.outputs.source_ref }}
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_DEPLOY_KEY: ${{ secrets.ZERG_SOURCE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/zerglang-source-deploy-key"
          known_hosts_path="$RUNNER_TEMP/zerglang-github-known-hosts"
          github_meta_path="$RUNNER_TEMP/zerglang-github-meta.json"
          cleanup() {
            rm -f "$key_path" "$known_hosts_path" "$github_meta_path"
          }
          trap cleanup EXIT

          umask 077
          printf '%s\n' "$SOURCE_DEPLOY_KEY" >"$key_path"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --proto '=https' --tlsv1.2 \
            https://api.github.com/meta >"$github_meta_path"
          jq -er \
            '.ssh_keys[] | select(startswith("ssh-ed25519 ")) | "github.com " + .' \
            "$github_meta_path" >"$known_hosts_path"
          ssh-keygen -F github.com -f "$known_hosts_path" >/dev/null

          export GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_path"
          git init --ref-format=reftable source
          git -C source remote add origin git@github.com:Epoch-ML/zerg.git
          git -C source fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C source fetch --no-tags --depth=1 origin "$EXPECTED_REF:$EXPECTED_REF"
          git -C source checkout --detach "$EXPECTED_SHA"

      - name: Verify source commit and release tag
        working-directory: source
        env:
          EXPECTED_REF: ${{ needs.validate.outputs.source_ref }}
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "$EXPECTED_REF")"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]] || {
            echo "::error::source checkout resolved to $actual_sha, not requested SHA"
            exit 1
          }
          [[ "$tag_sha" == "$EXPECTED_SHA" ]] || {
            echo "::error::$EXPECTED_REF does not resolve to the requested source SHA"
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/zerglang/ide/package-lock.json

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-darwin --toolchain "$RUST_TOOLCHAIN"
          rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == "aarch64-apple-darwin" ]]

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: zerglang-ide-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('source/zerglang/ide/src-tauri/Cargo.lock') }}
          restore-keys: |
            zerglang-ide-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja llvm openssl@3 z3 minisign
          llvm_prefix="$(brew --prefix llvm)"
          openssl_prefix="$(brew --prefix openssl@3)"
          {
            echo "$llvm_prefix/bin"
          } >>"$GITHUB_PATH"
          {
            echo "LLVM_DIR=$llvm_prefix/lib/cmake/llvm"
            echo "OPENSSL_ROOT_DIR=$openssl_prefix"
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$(brew --prefix z3)/lib/pkgconfig"
          } >>"$GITHUB_ENV"

      - name: Prepare preview signing
        if: needs.validate.outputs.channel == 'preview'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >>"$GITHUB_ENV"

      - name: Require and import stable Apple identity
        if: needs.validate.outputs.channel == 'stable'
        env:
          APPLE_API_ISSUER_SECRET: ${{ secrets.ZERGLANG_APPLE_API_ISSUER }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.ZERGLANG_APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_SECRET: ${{ secrets.ZERGLANG_APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.ZERGLANG_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.ZERGLANG_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.ZERGLANG_APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in \
            APPLE_API_ISSUER_SECRET \
            APPLE_API_KEY_ID_SECRET \
            APPLE_API_PRIVATE_KEY_SECRET \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD_SECRET \
            APPLE_SIGNING_IDENTITY_SECRET; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::stable publication requires $variable_name"
              exit 1
            fi
          done
          [[ "$APPLE_API_KEY_ID_SECRET" =~ ^[0-9A-Za-z]{10,32}$ ]] || {
            echo "::error::Apple API key ID has an invalid format"
            exit 1
          }
          [[ "$APPLE_API_ISSUER_SECRET" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || {
            echo "::error::Apple API issuer has an invalid format"
            exit 1
          }

          certificate_path="$RUNNER_TEMP/zerglang-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
          keychain_path="$RUNNER_TEMP/zerglang-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "ZERGLANG_APPLE_KEYCHAIN=$keychain_path" >>"$GITHUB_ENV"

          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_CERTIFICATE_BASE64, "base64"));
          ' "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY_SECRET" >"$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          [[ -s "$certificate_path" && -s "$api_key_path" ]]

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD_SECRET" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "\"$APPLE_SIGNING_IDENTITY_SECRET\"" >/dev/null || {
                echo "::error::configured Developer ID identity was not imported"
                exit 1
              }

          {
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID_SECRET"
            echo "APPLE_API_KEY_PATH=$api_key_path"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET"
          } >>"$GITHUB_ENV"

      - name: Build and test compiler
        working-directory: source/zerglang
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release
          ctest --preset release --output-on-failure

      - name: Install and audit IDE packages
        working-directory: source/zerglang/ide
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --omit=optional --audit-level=high
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Test IDE frontend, native layer, and packaging contract
        working-directory: source/zerglang/ide
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run typecheck
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --all-targets \
            -- \
            -D warnings
          npm run test:packaging

      - name: Generate immutable release configuration
        working-directory: source/zerglang/ide
        run: npm run release:config

      - name: Build updater archive and DMG
        working-directory: source/zerglang/ide
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build \
            --target aarch64-apple-darwin \
            --bundles app,dmg \
            --config src-tauri/tauri.release.conf.json

      - name: Audit native app bundle
        working-directory: source/zerglang/ide
        run: npm run audit:macos-bundle

      - name: Smoke-test the embedded compiler in every execution tier
        working-directory: source/zerglang/ide
        shell: bash
        run: |
          set -euo pipefail
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ZergLang.app"
          toolchain="$app_path/Contents/Resources/toolchain"
          zlc="$toolchain/bin/zlc"
          example="../examples/answer.zl"

          interpreter_result="$("$zlc" run --tier=interpreter "$example")"
          jit_result="$("$zlc" run --tier=jit "$example")"
          [[ "$interpreter_result" == "42" ]] || {
            echo "::error::packaged interpreter returned '$interpreter_result', expected 42"
            exit 1
          }
          [[ "$jit_result" == "42" ]] || {
            echo "::error::packaged JIT returned '$jit_result', expected 42"
            exit 1
          }

          aot_object="$RUNNER_TEMP/zerglang-answer.o"
          aot_program="$RUNNER_TEMP/zerglang-answer"
          "$zlc" build --emit=object --output="$aot_object" "$example"
          xcrun clang \
            -arch arm64 \
            -mmacosx-version-min=15.0 \
            "$aot_object" \
            "$toolchain/aot_launcher.c" \
            -o "$aot_program"
          aot_result="$("$aot_program")"
          [[ "$aot_result" == "42" ]] || {
            echo "::error::packaged AOT program returned '$aot_result', expected 42"
            exit 1
          }

      - id: notarization
        name: Require stable notarization evidence
        if: needs.validate.outputs.channel == 'stable'
        working-directory: source/zerglang/ide
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_path="$bundle_root/macos/ZergLang.app"
          dmg_candidates=("$bundle_root"/dmg/*_aarch64.dmg)
          [[ ${#dmg_candidates[@]} -eq 1 && -f "${dmg_candidates[0]}" ]]
          notary_result="$RUNNER_TEMP/zerglang-dmg-notarization.json"
          xcrun notarytool submit "${dmg_candidates[0]}" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --output-format json >"$notary_result"
          jq -e '.status == "Accepted"' "$notary_result" >/dev/null
          xcrun stapler staple "${dmg_candidates[0]}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "${dmg_candidates[0]}"
          hdiutil verify "${dmg_candidates[0]}" >/dev/null
          echo "notarized=true" >>"$GITHUB_OUTPUT"

      - name: Verify updater signature
        working-directory: source/zerglang/ide
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/aarch64-apple-darwin/release/bundle"
          archive_candidates=("$bundle_root"/macos/*.app.tar.gz)
          [[ ${#archive_candidates[@]} -eq 1 && -f "${archive_candidates[0]}" ]]
          archive="${archive_candidates[0]}"
          [[ -s "$archive.sig" ]]
          minisign -Vm "$archive" \
            -x <(openssl base64 -d -A -in "$archive.sig") \
            -p <(openssl base64 -d -A -in src-tauri/updater.pubkey)

      - name: Collect immutable release payload
        working-directory: source/zerglang/ide
        env:
          ZERGLANG_APPLE_NOTARIZED: ${{ needs.validate.outputs.channel == 'stable' && 'true' || 'false' }}
          ZERGLANG_RELEASE_NOTES: ZergLang IDE ${{ needs.validate.outputs.channel }} release from source ${{ needs.validate.outputs.source_sha }}.
        shell: bash
        run: |
          set -euo pipefail
          npm run release:collect
          cd dist/release
          shasum -a 256 -c checksums.txt
          jq -e \
            --arg version "$ZERGLANG_IDE_VERSION" \
            --arg sha "$ZERGLANG_SOURCE_SHA" \
            '.version == $version and .source_sha == $sha and .platform == "darwin-aarch64"' \
            release-metadata.json >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.validate.outputs.release_tag }}
          path: source/zerglang/ide/dist/release/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Apple identity
        if: always() && needs.validate.outputs.channel == 'stable'
        shell: bash
        run: |
          if [[ -n "${ZERGLANG_APPLE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$ZERGLANG_APPLE_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP"/zerglang-developer-id.p12 \
            "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    name: Publish immutable assets and manifest
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: index

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.validate.outputs.release_tag }}
          path: payload

      - name: Validate publication payload
        shell: bash
        run: |
          set -euo pipefail
          archive_candidates=(payload/*.app.tar.gz)
          signature_candidates=(payload/*.app.tar.gz.sig)
          dmg_candidates=(payload/*.dmg)
          [[ ${#archive_candidates[@]} -eq 1 && -f "${archive_candidates[0]}" ]]
          [[ ${#signature_candidates[@]} -eq 1 && -f "${signature_candidates[0]}" ]]
          [[ ${#dmg_candidates[@]} -eq 1 && -f "${dmg_candidates[0]}" ]]
          [[ -s payload/checksums.txt && -s payload/release-metadata.json ]]
          [[ -s payload/latest.json ]]
          cd payload
          shasum -a 256 -c checksums.txt
          jq -e \
            --arg version "${{ needs.validate.outputs.version }}" \
            --arg channel "${{ needs.validate.outputs.channel }}" \
            --arg sha "${{ needs.validate.outputs.source_sha }}" \
            '.version == $version and .channel == $channel and .source_sha == $sha' \
            release-metadata.json >/dev/null
          jq -e \
            --arg version "${{ needs.validate.outputs.version }}" \
            '.version == $version and (.platforms["darwin-aarch64"].signature | length > 0)' \
            latest.json >/dev/null

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release already exists and will not be overwritten: $RELEASE_TAG"
            exit 1
          fi

          notes_path="$RUNNER_TEMP/release-notes.md"
          {
            echo "ZergLang IDE $RELEASE_VERSION ($RELEASE_CHANNEL)."
            echo
            echo "Built from immutable Epoch-ML/zerg source commit \`$SOURCE_SHA\`."
            echo
            echo "The updater archive is signed independently from the macOS application signature."
          } >"$notes_path"

          release_options=(
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "ZergLang IDE $RELEASE_VERSION ($RELEASE_CHANNEL)"
            --notes-file "$notes_path"
          )
          if [[ "$RELEASE_CHANNEL" == "preview" ]]; then
            release_options+=(--prerelease --latest=false)
          else
            release_options+=(--latest)
          fi

          gh release create "$RELEASE_TAG" \
            payload/*.app.tar.gz \
            payload/*.app.tar.gz.sig \
            payload/*.dmg \
            payload/checksums.txt \
            payload/release-metadata.json \
            "${release_options[@]}"

      - name: Download and compare every published asset over HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/published-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$release_json"
          mapfile -t local_assets < <(
            find payload -maxdepth 1 -type f ! -name latest.json -print | sort
          )
          published_count="$(jq '.assets | length' "$release_json")"
          [[ "$published_count" -eq "${#local_assets[@]}" ]] || {
            echo "::error::published asset count does not match the local payload"
            exit 1
          }

          verify_dir="$RUNNER_TEMP/published-assets"
          mkdir -p "$verify_dir"
          for local_path in "${local_assets[@]}"; do
            asset_name="$(basename "$local_path")"
            asset_url="$(
              jq -er --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | .browser_download_url' \
                "$release_json"
            )"
            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --silent \
              --show-error \
              "$asset_url" \
              --output "$verify_dir/$asset_name"
            cmp "$local_path" "$verify_dir/$asset_name"
          done

          manifest_url="$(jq -r '.platforms["darwin-aarch64"].url' payload/latest.json)"
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --silent \
            --show-error \
            "$manifest_url" \
            --output "$RUNNER_TEMP/manifest-updater-archive"
          cmp payload/*.app.tar.gz "$RUNNER_TEMP/manifest-updater-archive"

      - name: Commit updater manifest after asset verification
        working-directory: index
        env:
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          mkdir -p "site/$RELEASE_CHANNEL/releases"
          cp ../payload/latest.json "site/$RELEASE_CHANNEL/latest.json"
          cp ../payload/release-metadata.json \
            "site/$RELEASE_CHANNEL/releases/$RELEASE_VERSION.json"
          git add \
            "site/$RELEASE_CHANNEL/latest.json" \
            "site/$RELEASE_CHANNEL/releases/$RELEASE_VERSION.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish $RELEASE_TAG updater manifest"
          git push origin HEAD:main

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: index/site

  deploy-pages:
    name: Deploy verified updater site
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
