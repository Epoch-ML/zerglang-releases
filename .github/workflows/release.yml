name: Build and publish ZergLang IDE

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: Existing requests/<release-tag>.json to build or recover
        type: string
        required: true

concurrency:
  group: zerglang-ide-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable request and protected public tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.request.outputs.channel }}
      release_tag: ${{ steps.request.outputs.release_tag }}
      requested_at: ${{ steps.request.outputs.requested_at }}
      request_commit: ${{ steps.select.outputs.request_commit }}
      request_path: ${{ steps.select.outputs.request_path }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_repository: ${{ steps.request.outputs.source_repository }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Require protected main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::release recovery may run only from protected main"
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: select
        name: Select one immutable request addition
        env:
          DISPATCH_REQUEST: ${{ inputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          request_path="$DISPATCH_REQUEST"
          if [[ ! "$request_path" =~ ^requests/[0-9A-Za-z._+-]+\.json$ ]]; then
            echo "::error::request path must be requests/<release-tag>.json"
            exit 1
          fi
          [[ ! -L "$request_path" && -f "$request_path" ]] || {
            echo "::error::request must be one existing regular non-symlink file"
            exit 1
          }
          mapfile -t additions < <(git log --diff-filter=A --format=%H -- "$request_path")
          if [[ "${#additions[@]}" -ne 1 || ! "${additions[0]}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::request path must have exactly one immutable addition commit"
            exit 1
          fi
          request_commit="${additions[0]}"
          git merge-base --is-ancestor "$request_commit" "$GITHUB_SHA"
          read -r -a commit_and_parents <<<"$(git rev-list --parents -n 1 "$request_commit")"
          [[ "${#commit_and_parents[@]}" -eq 2 ]] || {
            echo "::error::request addition must be a single-parent commit"
            exit 1
          }
          mapfile -d '' -t addition_changes < <(
            git diff --name-status --no-renames -z "${request_commit}^" "$request_commit"
          )
          if [[
            "${#addition_changes[@]}" -ne 2
            || "${addition_changes[0]}" != "A"
            || "${addition_changes[1]}" != "$request_path"
          ]]; then
            echo "::error::the request addition commit must add only this request"
            exit 1
          fi
          request_mode="$(git ls-tree "$request_commit" -- "$request_path" | cut -d ' ' -f 1)"
          [[ "$request_mode" == "100644" ]] || {
            echo "::error::immutable request must be a normal non-executable file"
            exit 1
          }
          committed_request="$RUNNER_TEMP/zerglang-request-at-addition.json"
          git show "$request_commit:$request_path" >"$committed_request"
          cmp "$request_path" "$committed_request"
          echo "request_commit=$request_commit" >>"$GITHUB_OUTPUT"
          echo "request_path=$request_path" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Test the public release boundary
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm audit --audit-level=moderate

      - id: request
        name: Validate request schema
        env:
          REQUEST_PATH: ${{ steps.select.outputs.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          canonical="$RUNNER_TEMP/zerglang-canonical-request.json"
          node scripts/release-request.mjs "$REQUEST_PATH" >"$canonical"
          release_tag="$(jq -r .release_tag "$canonical")"
          [[ "$REQUEST_PATH" == "requests/${release_tag}.json" ]] || {
            echo "::error::request filename must be requests/${release_tag}.json"
            exit 1
          }
          for field in channel release_tag requested_at source_ref source_repository source_sha version; do
            printf '%s=%s\n' "$field" "$(jq -r ".$field" "$canonical")" >>"$GITHUB_OUTPUT"
          done

      - name: Require the protected tag at the immutable request commit
        env:
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          REQUEST_COMMIT: ${{ steps.select.outputs.request_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$tag_commit" == "$REQUEST_COMMIT" ]] || {
            echo "::error::release tag targets $tag_commit; expected REQUEST_COMMIT $REQUEST_COMMIT"
            exit 1
          }

  build:
    name: Build without release signing credentials
    needs: validate
    runs-on: macos-15
    timeout-minutes: 120
    environment: zerglang-source-read
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      RUST_TOOLCHAIN: "1.88.0"
      ZERGLANG_IDE_VERSION: ${{ needs.validate.outputs.version }}
      ZERGLANG_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      ZERGLANG_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      ZERGLANG_UPDATE_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: release-repository
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - name: Test trusted public staging policy before source checkout
        working-directory: release-repository
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Fetch exact source objects with one read key
        env:
          EXPECTED_REF: ${{ needs.validate.outputs.source_ref }}
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_DEPLOY_KEY: ${{ secrets.ZERG_SOURCE_DEPLOY_KEY }}
          SOURCE_REPOSITORY: ${{ needs.validate.outputs.source_repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_DEPLOY_KEY" ]] || {
            echo "::error::ZERG_SOURCE_DEPLOY_KEY is unavailable"
            exit 1
          }
          secure_dir="$RUNNER_TEMP/zerglang-source-ssh"
          install -d -m 700 "$secure_dir"
          key_path="$secure_dir/deploy-key"
          known_hosts="$secure_dir/known-hosts"
          cleanup() {
            rm -f "$key_path"
          }
          trap cleanup EXIT
          install -m 600 /dev/null "$key_path"
          printf '%s\n' "$SOURCE_DEPLOY_KEY" >"$key_path"
          unset SOURCE_DEPLOY_KEY
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --proto '=https' --tlsv1.2 \
            https://api.github.com/meta \
            | jq -er '.ssh_keys[] | "github.com " + .' >"$known_hosts"
          unset GH_TOKEN
          chmod 600 "$known_hosts"
          ssh_command="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          git init --ref-format=reftable source-git
          git -C source-git remote add origin "git@github.com:${SOURCE_REPOSITORY}.git"
          GIT_SSH_COMMAND="$ssh_command" git -C source-git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          GIT_SSH_COMMAND="$ssh_command" git -C source-git fetch --no-tags --depth=1 origin \
            "$EXPECTED_REF:$EXPECTED_REF"
          [[ "$(git -C source-git rev-parse "${EXPECTED_REF}^{commit}")" == "$EXPECTED_SHA" ]]
          git -C source-git cat-file -e "${EXPECTED_SHA}^{commit}"
          unset ssh_command
          cleanup
          trap - EXIT

      - name: Delete the ephemeral source credential
        if: always()
        run: rm -f "$RUNNER_TEMP/zerglang-source-ssh/deploy-key"

      - name: Materialize verified source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          git -C source-git archive "$ZERGLANG_SOURCE_SHA" | tar -x -C source
          [[ -f source/zerglang/CMakeLists.txt ]]
          [[ -f source/zerglang/ide/package-lock.json ]]

      - name: Require independent committed channel trust roots
        shell: bash
        run: |
          set -euo pipefail
          preview_release="release-repository/keys/zerglang-preview-updater.pubkey"
          stable_release="release-repository/keys/zerglang-stable-updater.pubkey"
          preview_source="source/zerglang/ide/src-tauri/updater.preview.pubkey"
          stable_source="source/zerglang/ide/src-tauri/updater.stable.pubkey"
          for key in "$preview_release" "$stable_release" "$preview_source" "$stable_source"; do
            [[ -f "$key" && ! -L "$key" && -s "$key" ]]
          done
          cmp --silent "$preview_release" "$preview_source"
          cmp --silent "$stable_release" "$stable_source"
          if cmp --silent "$preview_release" "$stable_release"; then
            echo "::error::preview and stable updater trust roots must be distinct"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: source/zerglang/ide/package-lock.json

      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component clippy,rustfmt --target aarch64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == "aarch64-apple-darwin" ]]
          brew install cmake ninja llvm openssl@3 z3
          llvm_prefix="$(brew --prefix llvm)"
          openssl_prefix="$(brew --prefix openssl@3)"
          echo "$llvm_prefix/bin" >>"$GITHUB_PATH"
          {
            echo "LLVM_DIR=$llvm_prefix/lib/cmake/llvm"
            echo "OPENSSL_ROOT_DIR=$openssl_prefix"
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$(brew --prefix z3)/lib/pkgconfig"
          } >>"$GITHUB_ENV"

      - name: Build and test the exact compiler source
        working-directory: source/zerglang
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release
          ctest --preset release --output-on-failure

      - name: Install, audit, and test the exact IDE source
        working-directory: source/zerglang/ide
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --omit=optional --audit-level=high
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock
          npm test
          npm run typecheck
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          npm run test:packaging

      - name: Generate and verify channel-bound release configuration
        working-directory: source/zerglang/ide
        env:
          ZERGLANG_UPDATE_BASE_URL: https://epoch-ml.github.io/zerglang-releases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ZERGLANG_UPDATE_CHANNEL" == "stable" ]]; then
            key_name="updater.stable.pubkey"
          else
            key_name="updater.preview.pubkey"
          fi
          release_root="$GITHUB_WORKSPACE/release-repository/keys/zerglang-${ZERGLANG_UPDATE_CHANNEL}-updater.pubkey"
          TAURI_UPDATER_PUBKEY="$(tr -d '\r\n' <"$release_root")" npm run release:config
          CONFIG_PATH="src-tauri/tauri.release.conf.json" \
          KEY_PATH="src-tauri/$key_name" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile, writeFile } from "node:fs/promises";

          const config = JSON.parse(await readFile(process.env.CONFIG_PATH, "utf8"));
          const publicKey = (await readFile(process.env.KEY_PATH, "utf8")).trim();
          assert.equal(config.version, process.env.ZERGLANG_IDE_VERSION);
          assert.equal(config.plugins.updater.pubkey, publicKey);
          assert.deepEqual(config.plugins.updater.endpoints, [
            `https://epoch-ml.github.io/zerglang-releases/${process.env.ZERGLANG_UPDATE_CHANNEL}/latest.json`,
          ]);
          const unsigned = structuredClone(config);
          unsigned.bundle.createUpdaterArtifacts = false;
          unsigned.bundle.targets = ["app"];
          unsigned.bundle.macOS = { ...unsigned.bundle.macOS, signingIdentity: "-" };
          await writeFile(
            "src-tauri/tauri.unsigned.release.conf.json",
            `${JSON.stringify(unsigned, null, 2)}\n`,
          );
          NODE

      - name: Build the ad-hoc source stage without release credentials
        working-directory: source/zerglang/ide
        env:
          APPLE_SIGNING_IDENTITY: "-"
          VITE_ZERGLANG_UPDATER_ENABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build \
            --ci \
            --target aarch64-apple-darwin \
            --bundles app \
            --skip-stapling \
            --config src-tauri/tauri.unsigned.release.conf.json
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ZergLang.app"
          [[ -d "$app" && ! -L "$app" ]]
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Smoke-test packaged interpreter, JIT, and AOT tiers
        working-directory: source/zerglang/ide
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ZergLang.app"
          toolchain="$app/Contents/Resources/toolchain"
          zlc="$toolchain/bin/zlc"
          example="../examples/answer.zl"
          [[ "$("$zlc" run --tier=interpreter "$example")" == "42" ]]
          [[ "$("$zlc" run --tier=jit "$example")" == "42" ]]
          object="$RUNNER_TEMP/zerglang-answer.o"
          program="$RUNNER_TEMP/zerglang-answer"
          "$zlc" build --emit=object --output="$object" "$example"
          xcrun clang -arch arm64 -mmacosx-version-min=15.0 \
            "$object" "$toolchain/aot_launcher.c" -o "$program"
          [[ "$("$program")" == "42" ]]

      - name: Package the bounded unsigned source stage
        working-directory: source/zerglang/ide
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ZergLang.app"
          stage="dist/source-stage"
          mkdir -p "$stage"
          archive="$stage/ZergLang_${ZERGLANG_IDE_VERSION}_aarch64.source.app.tar.gz"
          node "$GITHUB_WORKSPACE/release-repository/scripts/package-macos.mjs" "$app" "$archive"
          if [[ "$ZERGLANG_UPDATE_CHANNEL" == "stable" ]]; then
            key_name="updater.stable.pubkey"
          else
            key_name="updater.preview.pubkey"
          fi
          cp "src-tauri/$key_name" "$stage/updater.pubkey"
          OUTPUT="$stage/build-metadata.json" node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          await writeFile(process.env.OUTPUT, `${JSON.stringify({
            schema_version: 2,
            product: "ZergLang IDE",
            version: process.env.ZERGLANG_IDE_VERSION,
            channel: process.env.ZERGLANG_UPDATE_CHANNEL,
            release_tag: process.env.ZERGLANG_RELEASE_TAG,
            source_sha: process.env.ZERGLANG_SOURCE_SHA,
            platform: "darwin-aarch64",
            apple_signature: "none",
          }, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerglang-unsigned-source-stage
          path: source/zerglang/ide/dist/source-stage/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  apple_sign:
    name: Sign and notarize without executing product code
    needs:
      - validate
      - build
    runs-on: macos-15
    timeout-minutes: 90
    environment:
      name: ${{ needs.validate.outputs.channel == 'stable' && 'stable' || 'zerglang-apple-preview' }}
    permissions:
      contents: read
    env:
      CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      REQUEST_PATH: ${{ needs.validate.outputs.request_path }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Test trusted public Apple-signing policy
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zerglang-unsigned-source-stage
          path: source-stage

      - name: Verify and extract the hostile source stage
        env:
          OUTPUT_DIRECTORY: ${{ runner.temp }}/zerglang-apple-input
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-request.mjs "$REQUEST_PATH" >/dev/null
          node --input-type=module <<'NODE'
          import { readReleaseRequest } from "./scripts/release-request.mjs";
          import { prepareSourceStage } from "./scripts/source-stage.mjs";
          const request = await readReleaseRequest(process.env.REQUEST_PATH);
          const key = request.channel === "stable"
            ? "keys/zerglang-stable-updater.pubkey"
            : "keys/zerglang-preview-updater.pubkey";
          const result = await prepareSourceStage({
            inputDirectory: "source-stage",
            outputDirectory: process.env.OUTPUT_DIRECTORY,
            publicKeyPath: key,
            request,
            maxArchiveBytes: 1_073_741_824,
            maxEntryCount: 16_384,
            maxFileBytes: 536_870_912,
            maxUncompressedBytes: 2_147_483_648,
          });
          if (result.entryCount < 2 || result.uncompressedBytes < 1) {
            throw new Error("source stage must contain application bytes");
          }
          NODE
          plist="$OUTPUT_DIRECTORY/ZergLang.app/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == \
            "com.zergai.zerglang.ide" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == \
            "$VERSION" ]]

      - name: Apply preview ad-hoc or fail-closed stable Apple signing
        env:
          ZERGLANG_APPLE_API_ISSUER: ${{ secrets.ZERGLANG_APPLE_API_ISSUER }}
          ZERGLANG_APPLE_API_KEY_ID: ${{ secrets.ZERGLANG_APPLE_API_KEY_ID }}
          ZERGLANG_APPLE_API_PRIVATE_KEY: ${{ secrets.ZERGLANG_APPLE_API_PRIVATE_KEY }}
          ZERGLANG_APPLE_CERTIFICATE: ${{ secrets.ZERGLANG_APPLE_CERTIFICATE }}
          ZERGLANG_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.ZERGLANG_APPLE_CERTIFICATE_PASSWORD }}
          ZERGLANG_APPLE_SIGNING_IDENTITY: ${{ secrets.ZERGLANG_APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/zerglang-apple-input/ZergLang.app"
          identity="-"
          api_key_path=""
          if [[ "$CHANNEL" == "stable" ]]; then
            required=(
              ZERGLANG_APPLE_API_ISSUER
              ZERGLANG_APPLE_API_KEY_ID
              ZERGLANG_APPLE_API_PRIVATE_KEY
              ZERGLANG_APPLE_CERTIFICATE
              ZERGLANG_APPLE_CERTIFICATE_PASSWORD
              ZERGLANG_APPLE_SIGNING_IDENTITY
            )
            missing=()
            for name in "${required[@]}"; do
              if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
            done
            [[ "${#missing[@]}" -eq 0 ]] || {
              echo "::error::stable Apple environment is missing: ${missing[*]}"
              exit 1
            }
            [[ "$ZERGLANG_APPLE_API_KEY_ID" =~ ^[0-9A-Za-z]{10,32}$ ]]
            [[ "$ZERGLANG_APPLE_API_ISSUER" =~ ^[0-9A-Fa-f-]{36}$ ]]
            certificate_path="$RUNNER_TEMP/zerglang-developer-id.p12"
            api_key_path="$RUNNER_TEMP/AuthKey_${ZERGLANG_APPLE_API_KEY_ID}.p8"
            keychain_path="$RUNNER_TEMP/zerglang-release.keychain-db"
            original_keychain_path="$RUNNER_TEMP/zerglang-original-default-keychain"
            security default-keychain -d user | tr -d '"' >"$original_keychain_path"
            keychain_password="$(openssl rand -hex 32)"
            echo "::add-mask::$keychain_password"
            CERTIFICATE_PATH="$certificate_path" node -e \
              'const fs=require("node:fs"); const bytes=Buffer.from(process.env.ZERGLANG_APPLE_CERTIFICATE.replace(/\s/g,""),"base64"); if(!bytes.length)throw new Error("empty certificate"); fs.writeFileSync(process.env.CERTIFICATE_PATH,bytes,{mode:0o600});'
            install -m 600 /dev/null "$api_key_path"
            printf '%s\n' "$ZERGLANG_APPLE_API_PRIVATE_KEY" >"$api_key_path"
            grep -F 'BEGIN PRIVATE KEY' "$api_key_path" >/dev/null
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$certificate_path" -k "$keychain_path" \
              -P "$ZERGLANG_APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
              -k "$keychain_password" "$keychain_path"
            security list-keychains -d user -s "$keychain_path"
            security default-keychain -d user -s "$keychain_path"
            security find-identity -v -p codesigning "$keychain_path" \
              | grep -F -- "\"$ZERGLANG_APPLE_SIGNING_IDENTITY\"" >/dev/null
            identity="$ZERGLANG_APPLE_SIGNING_IDENTITY"
          fi

          scripts/sign-macos-app.sh "$app" "$identity" "$CHANNEL" "$VERSION"
          if [[ "$CHANNEL" == "stable" ]]; then
            app_zip="$RUNNER_TEMP/ZergLang-notarization.zip"
            app_result="$RUNNER_TEMP/zerglang-app-notarization.json"
            ditto -c -k --keepParent "$app" "$app_zip"
            xcrun notarytool submit "$app_zip" \
              --key "$api_key_path" --key-id "$ZERGLANG_APPLE_API_KEY_ID" \
              --issuer "$ZERGLANG_APPLE_API_ISSUER" --wait --output-format json \
              >"$app_result"
            jq -e '.status == "Accepted"' "$app_result" >/dev/null
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
          fi

          output="$RUNNER_TEMP/zerglang-platform-signed"
          dmg_root="$RUNNER_TEMP/zerglang-dmg-root"
          mkdir -p "$output" "$dmg_root"
          ditto "$app" "$dmg_root/ZergLang.app"
          ln -s /Applications "$dmg_root/Applications"
          dmg="$output/ZergLang_${VERSION}_aarch64.dmg"
          hdiutil create -volname ZergLang -srcfolder "$dmg_root" -format UDZO -ov "$dmg"
          dmg_sign_args=(--force --sign "$identity")
          if [[ "$CHANNEL" == "stable" ]]; then
            dmg_sign_args+=(--timestamp)
          else
            dmg_sign_args+=(--timestamp=none)
          fi
          codesign "${dmg_sign_args[@]}" "$dmg"
          hdiutil verify "$dmg" >/dev/null
          if [[ "$CHANNEL" == "stable" ]]; then
            dmg_result="$RUNNER_TEMP/zerglang-dmg-notarization.json"
            xcrun notarytool submit "$dmg" \
              --key "$api_key_path" --key-id "$ZERGLANG_APPLE_API_KEY_ID" \
              --issuer "$ZERGLANG_APPLE_API_ISSUER" --wait --output-format json \
              >"$dmg_result"
            jq -e '.status == "Accepted"' "$dmg_result" >/dev/null
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type execute --verbose=4 "$app"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"

      - name: Delete ephemeral Apple credentials
        if: always()
        shell: bash
        run: |
          set +e
          keychain_path="$RUNNER_TEMP/zerglang-release.keychain-db"
          original_keychain_path="$RUNNER_TEMP/zerglang-original-default-keychain"
          if [[ -s "$original_keychain_path" ]]; then
            original_keychain="$(cat "$original_keychain_path")"
            security list-keychains -d user -s "$original_keychain"
            security default-keychain -d user -s "$original_keychain"
          fi
          if [[ -f "$keychain_path" ]]; then security delete-keychain "$keychain_path"; fi
          rm -f "$RUNNER_TEMP/zerglang-developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8 "$original_keychain_path"

      - name: Package the signed payload without Apple credentials
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/zerglang-apple-input/ZergLang.app"
          output="$RUNNER_TEMP/zerglang-platform-signed"
          node scripts/package-macos.mjs "$app" "$output/ZergLang.app.tar.gz"
          cp source-stage/updater.pubkey "$output/updater.pubkey"
          APPLE_NOTARIZED="$([[ "$CHANNEL" == "stable" ]] && echo true || echo false)" \
          APPLE_SIGNATURE="$([[ "$CHANNEL" == "stable" ]] && echo developer-id || echo ad-hoc)" \
          OUTPUT="$output/platform-metadata.json" node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          await writeFile(process.env.OUTPUT, `${JSON.stringify({
            schema_version: 2,
            product: "ZergLang IDE",
            version: process.env.VERSION,
            channel: process.env.CHANNEL,
            release_tag: process.env.RELEASE_TAG,
            source_sha: process.env.SOURCE_SHA,
            platform: "darwin-aarch64",
            apple_signature: process.env.APPLE_SIGNATURE,
            apple_notarized: process.env.APPLE_NOTARIZED === "true",
          }, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerglang-platform-signed
          path: ${{ runner.temp }}/zerglang-platform-signed/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  signed_smoke:
    name: Verify and execute the signed application without credentials
    needs:
      - validate
      - apple_sign
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CHANNEL: ${{ needs.validate.outputs.channel }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: policy
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: policy/package-lock.json

      - name: Test trusted signed-payload policy before extraction
        working-directory: policy
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zerglang-platform-signed
          path: signed

      - name: Verify final Apple signatures and notarization
        env:
          OUTPUT_DIRECTORY: ${{ runner.temp }}/zerglang-signed-smoke
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(find signed -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 4 ]]
          if find signed -mindepth 1 -maxdepth 1 \! -type f -print -quit | grep -q .; then
            echo "::error::signed payload contains a non-regular entry"
            exit 1
          fi
          metadata="signed/platform-metadata.json"
          jq -e --arg channel "$CHANNEL" --arg version "$VERSION" \
            '.channel == $channel and .version == $version
             and .platform == "darwin-aarch64"
             and .apple_signature == (if $channel == "stable" then "developer-id" else "ad-hoc" end)
             and .apple_notarized == ($channel == "stable")' "$metadata" >/dev/null
          node --input-type=module <<'NODE'
          import { extractSourceApplication } from "./policy/scripts/package-macos.mjs";
          const result = await extractSourceApplication({
            archivePath: "signed/ZergLang.app.tar.gz",
            outputDirectory: process.env.OUTPUT_DIRECTORY,
            maxArchiveBytes: 536_870_912,
            maxEntryCount: 16_384,
            maxFileBytes: 536_870_912,
            maxUncompressedBytes: 2_147_483_648,
          });
          if (result.entryCount < 2 || result.uncompressedBytes < 1) {
            throw new Error("signed application archive is empty");
          }
          NODE
          app="$OUTPUT_DIRECTORY/ZergLang.app"
          dmg="signed/ZergLang_${VERSION}_aarch64.dmg"
          [[ -d "$app" && ! -L "$app" && -f "$dmg" && ! -L "$dmg" ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"
          hdiutil verify "$dmg" >/dev/null
          if [[ "$CHANNEL" == "stable" ]]; then
            xcrun stapler validate "$app"
            xcrun stapler validate "$dmg"
            app_assessment="$(spctl --assess --type execute --verbose=4 "$app" 2>&1)"
            dmg_assessment="$(spctl --assess --type open \
              --context context:primary-signature --verbose=4 "$dmg" 2>&1)"
            grep -F 'source=Notarized Developer ID' <<<"$app_assessment"
            grep -F 'source=Notarized Developer ID' <<<"$dmg_assessment"
          else
            codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'
            codesign -dv --verbose=4 "$dmg" 2>&1 | grep -F 'Signature=adhoc'
          fi

      - name: Smoke-test packaged interpreter, JIT, and AOT tiers
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/zerglang-signed-smoke/ZergLang.app"
          toolchain="$app/Contents/Resources/toolchain"
          zlc="$toolchain/bin/zlc"
          example="$RUNNER_TEMP/answer.zl"
          cat >"$example" <<'ZERGLANG'
          module answer;

          public value App {
              public algorithm message main(type: Class<Self>) -> Int32
              ensures { result == 42; } effects {} {
                  return 6 * 7;
              }
          }
          ZERGLANG
          [[ "$("$zlc" run --tier=interpreter "$example")" == "42" ]]
          [[ "$("$zlc" run --tier=jit "$example")" == "42" ]]
          object="$RUNNER_TEMP/zerglang-signed-answer.o"
          program="$RUNNER_TEMP/zerglang-signed-answer"
          "$zlc" build --emit=object --output="$object" "$example"
          xcrun clang -arch arm64 -mmacosx-version-min=15.0 \
            "$object" "$toolchain/aot_launcher.c" -o "$program"
          [[ "$("$program")" == "42" ]]

  sign_updater_preview:
    name: Sign the finished updater archive on a fresh runner (preview)
    needs:
      - validate
      - signed_smoke
    if: needs.validate.outputs.channel == 'preview'
    runs-on: ubuntu-24.04
    environment: preview
    permissions:
      contents: read
    env:
      REQUEST_PATH: ${{ needs.validate.outputs.request_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install and test public updater-signing policy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zerglang-platform-signed
          path: release-input
      - name: Prepare the public preview updater verifier
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent keys/zerglang-preview-updater.pubkey release-input/updater.pubkey
          verifier_archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-filesize 10485760 \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "$verifier_archive"
          echo '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  '"$verifier_archive" \
            | sha256sum -c -
          tar -xzf "$verifier_archive" -C "$RUNNER_TEMP"
          PUBLIC_KEY=keys/zerglang-preview-updater.pubkey node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/zerglang-updater.pub", Buffer.from(fs.readFileSync(process.env.PUBLIC_KEY, "utf8").trim(), "base64"));
          NODE
      - name: Sign only the preview updater archive
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.ZERGLANG_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.ZERGLANG_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$TAURI_PRIVATE_KEY" && -n "$TAURI_PRIVATE_KEY_PASSWORD" ]] || {
            echo "::error::preview updater signing identity is incomplete"
            exit 1
          }
          cmp --silent keys/zerglang-preview-updater.pubkey release-input/updater.pubkey
          npm exec --offline -- tauri signer sign release-input/ZergLang.app.tar.gz
          [[ -s release-input/ZergLang.app.tar.gz.sig ]]
          unset TAURI_PRIVATE_KEY TAURI_PRIVATE_KEY_PASSWORD
      - name: Verify and collect the preview payload without credentials
        shell: bash
        run: |
          set -euo pipefail
          SIGNATURE=release-input/ZergLang.app.tar.gz.sig node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/zerglang-updater.minisig", Buffer.from(fs.readFileSync(process.env.SIGNATURE, "utf8").trim(), "base64"));
          NODE
          "$RUNNER_TEMP/minisign-linux/x86_64/minisign" \
            -Vm release-input/ZergLang.app.tar.gz \
            -p "$RUNNER_TEMP/zerglang-updater.pub" \
            -x "$RUNNER_TEMP/zerglang-updater.minisig"
          node scripts/release-payload.mjs "$REQUEST_PATH" release-input release
          (cd release && sha256sum -c checksums.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerglang-release-payload
          path: release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign_updater_stable:
    name: Sign the finished updater archive on a fresh runner (stable)
    needs:
      - validate
      - signed_smoke
    if: needs.validate.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    environment: zerglang-updater-stable
    permissions:
      contents: read
    env:
      REQUEST_PATH: ${{ needs.validate.outputs.request_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install and test public updater-signing policy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zerglang-platform-signed
          path: release-input
      - name: Prepare the public stable updater verifier
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent keys/zerglang-stable-updater.pubkey release-input/updater.pubkey
          verifier_archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-filesize 10485760 \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "$verifier_archive"
          echo '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  '"$verifier_archive" \
            | sha256sum -c -
          tar -xzf "$verifier_archive" -C "$RUNNER_TEMP"
          PUBLIC_KEY=keys/zerglang-stable-updater.pubkey node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/zerglang-updater.pub", Buffer.from(fs.readFileSync(process.env.PUBLIC_KEY, "utf8").trim(), "base64"));
          NODE
      - name: Sign only the stable updater archive
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.ZERGLANG_STABLE_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.ZERGLANG_STABLE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$TAURI_PRIVATE_KEY" && -n "$TAURI_PRIVATE_KEY_PASSWORD" ]] || {
            echo "::error::stable updater signing identity is incomplete"
            exit 1
          }
          cmp --silent keys/zerglang-stable-updater.pubkey release-input/updater.pubkey
          npm exec --offline -- tauri signer sign release-input/ZergLang.app.tar.gz
          [[ -s release-input/ZergLang.app.tar.gz.sig ]]
          unset TAURI_PRIVATE_KEY TAURI_PRIVATE_KEY_PASSWORD
      - name: Verify and collect the stable payload without credentials
        shell: bash
        run: |
          set -euo pipefail
          SIGNATURE=release-input/ZergLang.app.tar.gz.sig node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/zerglang-updater.minisig", Buffer.from(fs.readFileSync(process.env.SIGNATURE, "utf8").trim(), "base64"));
          NODE
          "$RUNNER_TEMP/minisign-linux/x86_64/minisign" \
            -Vm release-input/ZergLang.app.tar.gz \
            -p "$RUNNER_TEMP/zerglang-updater.pub" \
            -x "$RUNNER_TEMP/zerglang-updater.minisig"
          node scripts/release-payload.mjs "$REQUEST_PATH" release-input release
          (cd release && sha256sum -c checksums.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerglang-release-payload
          path: release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign_updater:
    name: Require exactly one isolated updater signer
    needs:
      - sign_updater_preview
      - sign_updater_stable
    if: >-
      always() && !cancelled() &&
      ((needs.sign_updater_preview.result == 'success' && needs.sign_updater_stable.result == 'skipped') ||
       (needs.sign_updater_preview.result == 'skipped' && needs.sign_updater_stable.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record successful signer isolation
        run: echo 'Exactly one channel signer produced the release payload.'

  publish:
    name: Publish immutable assets and recover from canonical bytes
    needs:
      - validate
      - sign_updater
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      REQUEST_COMMIT: ${{ needs.validate.outputs.request_commit }}
      REQUESTED_AT: ${{ needs.validate.outputs.requested_at }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: release-repository
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: release-repository/package-lock.json
      - name: Test public publication policy
        working-directory: release-repository
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zerglang-release-payload
          path: release
      - name: Validate the exact six generated assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release/*.dmg
            release/*.app.tar.gz
            release/*.app.tar.gz.sig
            release/checksums.txt
            release/latest.json
            release/release-metadata.json
          )
          [[ "${#assets[@]}" -eq 6 ]] || {
            echo "::error::expected exactly six immutable release assets; found ${#assets[@]}"
            exit 1
          }
          [[ "$(find release -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 6 ]]
          if find release -mindepth 1 -maxdepth 1 \! -type f -print -quit | grep -q .; then
            echo "::error::generated release contains a non-regular entry"
            exit 1
          fi
          (cd release && sha256sum -c checksums.txt)

      - id: release
        name: Create or resume the exact immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_title="ZergLang IDE $VERSION ($CHANNEL)"
          release_body="Verified ZergLang IDE $CHANNEL release from Epoch-ML/zerg@$SOURCE_SHA."
          expected_prerelease=false
          if [[ "$CHANNEL" == "preview" ]]; then expected_prerelease=true; fi
          git -C release-repository fetch --force --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          verify_tag() {
            local target
            target="$(git -C release-repository rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            [[ "$target" == "$REQUEST_COMMIT" ]] || {
              echo "::error::release tag moved to $target; expected request $REQUEST_COMMIT"
              exit 1
            }
          }
          verify_tag
          release_json="$RUNNER_TEMP/zerglang-release.json"
          release_pages="$RUNNER_TEMP/zerglang-release-pages.json"
          resolve_release() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              >"$release_pages"
            jq --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] |
               if length > 1 then error("duplicate releases for exact tag")
               elif length == 1 then .[0] else null end' \
              "$release_pages" >"$release_json"
          }
          resolve_release
          if jq -e '. == null' "$release_json" >/dev/null; then
            create_args=(
              "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag
              --title "$release_title" --notes "$release_body" --draft
            )
            if [[ "$CHANNEL" == "preview" ]]; then
              create_args+=(--prerelease --latest=false)
            else
              create_args+=(--latest)
            fi
            gh release create "${create_args[@]}"
            for attempt in {1..12}; do
              resolve_release
              if jq -e '. != null and .draft == true' "$release_json" >/dev/null; then break; fi
              [[ "$attempt" -lt 12 ]] || {
                echo "::error::new draft did not converge"
                exit 1
              }
              sleep 5
            done
          fi
          release_id="$(jq -er '.id | select(type == "number" and . > 0 and floor == .)' "$release_json")"
          refresh_release() {
            gh api --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" >"$release_json"
            jq -e --arg tag "$RELEASE_TAG" --argjson id "$release_id" \
              '.id == $id and .tag_name == $tag' "$release_json" >/dev/null
          }
          refresh_release
          jq -e --arg tag "$RELEASE_TAG" --arg title "$release_title" \
            --arg body "$release_body" --argjson prerelease "$expected_prerelease" \
            '.tag_name == $tag and .name == $title and .body == $body
             and .prerelease == $prerelease and (.draft | type == "boolean")' \
            "$release_json" >/dev/null

          expected_names="$RUNNER_TEMP/zerglang-expected-assets.txt"
          remote_names="$RUNNER_TEMP/zerglang-remote-assets.txt"
          find release -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort >"$expected_names"
          jq -r '.assets[].name' "$release_json" | LC_ALL=C sort >"$remote_names"
          duplicate_names="$(jq -r '.assets | group_by(.name)[] | select(length > 1) | .[0].name' "$release_json")"
          [[ -z "$duplicate_names" ]] || {
            echo "::error::release contains duplicate asset names: $duplicate_names"
            exit 1
          }
          while IFS= read -r name; do
            grep -Fqx "$name" "$expected_names" || {
              echo "::error::existing release contains unexpected asset: $name"
              exit 1
            }
          done <"$remote_names"

          release_is_draft="$(jq -r '.draft | tostring' "$release_json")"
          if [[ "$release_is_draft" != "true" ]]; then
            jq -e '.immutable == true' "$release_json" >/dev/null || {
              echo "::error::published mutable release cannot be recovered"
              exit 1
            }
            diff -u "$expected_names" "$remote_names"
            echo 'Existing immutable release will be verified from its public bytes.'
            echo 'was_draft=false' >>"$GITHUB_OUTPUT"
            verify_tag
            exit 0
          fi
          jq -e '.immutable != true' "$release_json" >/dev/null || {
            echo "::error::draft cannot already report immutable"
            exit 1
          }

          authenticated="$RUNNER_TEMP/zerglang-authenticated-assets"
          mkdir -p "$authenticated"
          for asset in release/*; do
            name="$(basename "$asset")"
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$release_json")"
            if [[ "$count" -eq 0 ]]; then
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            elif [[ "$count" -eq 1 ]]; then
              id="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .id' "$release_json")"
              gh api -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$id" >"$authenticated/$name"
              cmp "$asset" "$authenticated/$name" || {
                echo "::error::Existing draft release asset bytes do not match: $name"
                exit 1
              }
            else
              echo "::error::draft contains duplicate asset names: $name"
              exit 1
            fi
          done
          refresh_release
          jq -r '.assets[].name' "$release_json" | LC_ALL=C sort >"$remote_names"
          diff -u "$expected_names" "$remote_names"
          for asset in release/*; do
            name="$(basename "$asset")"
            record="$(jq -cer --arg name "$name" \
              '[.assets[] | select(.name == $name)] | select(length == 1) | .[0]' \
              "$release_json")"
            id="$(jq -er '.id' <<<"$record")"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" >"$authenticated/$name"
            cmp "$asset" "$authenticated/$name" || {
              echo "::error::Existing draft release asset bytes do not match: $name"
              exit 1
            }
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          refresh_release
          [[ "$(jq -r '.draft | tostring' "$release_json")" == "false" ]]
          jq -e '.immutable == true' "$release_json" >/dev/null || {
            echo "::error::GitHub did not mark the published release immutable; refusing feed promotion"
            exit 1
          }
          verify_tag
          echo 'was_draft=true' >>"$GITHUB_OUTPUT"

      - name: Download and verify canonical public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WAS_DRAFT: ${{ steps.release.outputs.was_draft }}
        shell: bash
        run: |
          set -euo pipefail
          canonical="$RUNNER_TEMP/zerglang-canonical-release"
          [[ ! -e "$canonical" ]]
          mkdir "$canonical"
          release_json="$RUNNER_TEMP/zerglang-release.json"
          release_id="$(jq -er '.id' "$release_json")"
          gh api --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" >"$release_json"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .immutable == true
             and (.assets | length) == 6' "$release_json" >/dev/null
          expected_names="$RUNNER_TEMP/zerglang-canonical-expected.txt"
          actual_names="$RUNNER_TEMP/zerglang-canonical-actual.txt"
          find release -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort \
            >"$expected_names"
          jq -r '.assets[].name' "$release_json" | LC_ALL=C sort >"$actual_names"
          diff -u "$expected_names" "$actual_names"
          encoded_tag="$(jq -rn --arg value "$RELEASE_TAG" '$value|@uri')"
          total=0
          for generated in release/*; do
            name="$(basename "$generated")"
            record="$(jq -cer --arg name "$name" \
              '[.assets[] | select(.name == $name)] | select(length == 1) | .[0]' \
              "$release_json")"
            size="$(jq -er '.size | select(type == "number" and . > 0 and floor == .)' <<<"$record")"
            digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<<"$record")"
            url="$(jq -er '.browser_download_url' <<<"$record")"
            case "$name" in
              *.dmg|*.app.tar.gz) limit=$((512 * 1024 * 1024)) ;;
              *.sig|checksums.txt) limit=$((1024 * 1024)) ;;
              latest.json|release-metadata.json) limit=$((1024 * 1024)) ;;
              *) echo "::error::unexpected canonical asset: $name"; exit 1 ;;
            esac
            [[ "$size" -le "$limit" ]]
            total=$((total + size))
            [[ "$total" -lt $((1024 * 1024 * 1024)) ]]
            encoded_name="$(jq -rn --arg value "$name" '$value|@uri')"
            expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$encoded_tag/$encoded_name"
            [[ "$url" == "$expected_url" ]] || {
              echo "::error::asset URL escaped the immutable repository/tag/name"
              exit 1
            }
            curl --fail --show-error --silent --location --retry 8 --retry-all-errors \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --max-filesize "$limit" --output "$canonical/$name" "$url"
            [[ "$(wc -c <"$canonical/$name" | tr -d '[:space:]')" == "$size" ]]
            actual_digest="$(sha256sum "$canonical/$name" | cut -d ' ' -f 1)"
            [[ "$digest" == "sha256:$actual_digest" ]]
            if [[ "$RELEASE_WAS_DRAFT" == "true" ]]; then cmp "$generated" "$canonical/$name"; fi
          done
          CANONICAL="$canonical" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";

          const root = process.env.CANONICAL;
          const archive = "ZergLang.app.tar.gz";
          const signature = `${archive}.sig`;
          const dmg = `ZergLang_${process.env.VERSION}_aarch64.dmg`;
          const names = [archive, signature, dmg].sort();
          const artifacts = [];
          for (const name of names) {
            const bytes = await readFile(`${root}/${name}`);
            artifacts.push({
              name,
              sha256: createHash("sha256").update(bytes).digest("hex"),
            });
          }
          const expectedChecksums = artifacts
            .map(({ name, sha256 }) => `${sha256}  ${name}\n`).join("");
          assert.equal(await readFile(`${root}/checksums.txt`, "utf8"), expectedChecksums);
          const metadata = JSON.parse(await readFile(`${root}/release-metadata.json`, "utf8"));
          assert.deepEqual(Object.keys(metadata).sort(), [
            "apple_notarized", "artifacts", "channel", "platform", "product",
            "schema_version", "source_sha", "version",
          ]);
          assert.equal(metadata.schema_version, 1);
          assert.equal(metadata.product, "ZergLang IDE");
          assert.equal(metadata.version, process.env.VERSION);
          assert.equal(metadata.channel, process.env.CHANNEL);
          assert.equal(metadata.platform, "darwin-aarch64");
          assert.equal(metadata.source_sha, process.env.SOURCE_SHA);
          assert.equal(metadata.apple_notarized, process.env.CHANNEL === "stable");
          assert.deepEqual(metadata.artifacts, artifacts);
          const manifest = JSON.parse(await readFile(`${root}/latest.json`, "utf8"));
          assert.deepEqual(Object.keys(manifest).sort(), [
            "notes", "platforms", "pub_date", "version",
          ]);
          assert.equal(manifest.version, process.env.VERSION);
          assert.equal(
            manifest.notes,
            `ZergLang IDE ${process.env.CHANNEL} release from source ${process.env.SOURCE_SHA}.`,
          );
          assert.equal(manifest.pub_date, process.env.REQUESTED_AT);
          assert.deepEqual(Object.keys(manifest.platforms), ["darwin-aarch64"]);
          assert.equal(
            manifest.platforms["darwin-aarch64"].signature,
            (await readFile(`${root}/${signature}`, "utf8")).trim(),
          );
          NODE
          (cd "$canonical" && sha256sum -c checksums.txt)
          jq -e --arg version "$VERSION" --arg channel "$CHANNEL" --arg sha "$SOURCE_SHA" \
            '.version == $version and .channel == $channel and .source_sha == $sha' \
            "$canonical/release-metadata.json" >/dev/null
          encoded_archive="$(jq -rn --arg value 'ZergLang.app.tar.gz' '$value|@uri')"
          expected_archive_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$encoded_tag/$encoded_archive"
          jq -e --arg version "$VERSION" --arg url "$expected_archive_url" \
            '.version == $version and .platforms["darwin-aarch64"].url == $url
             and (.platforms["darwin-aarch64"].signature | length > 32)' \
            "$canonical/latest.json" >/dev/null
          cmp --silent \
            <(jq -r '.platforms["darwin-aarch64"].signature' "$canonical/latest.json") \
            <(tr -d '\r\n' <"$canonical/ZergLang.app.tar.gz.sig")
          key="release-repository/keys/zerglang-${CHANNEL}-updater.pubkey"
          PUBLIC_KEY="$key" SIGNATURE="$canonical/ZergLang.app.tar.gz.sig" node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/zerglang-updater.pub", Buffer.from(fs.readFileSync(process.env.PUBLIC_KEY, "utf8").trim(), "base64"));
          fs.writeFileSync(process.env.RUNNER_TEMP + "/zerglang-updater.minisig", Buffer.from(fs.readFileSync(process.env.SIGNATURE, "utf8").trim(), "base64"));
          NODE
          verifier_archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "$verifier_archive"
          echo '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  '"$verifier_archive" \
            | sha256sum -c -
          tar -xzf "$verifier_archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/minisign-linux/x86_64/minisign" \
            -Vm "$canonical/ZergLang.app.tar.gz" \
            -p "$RUNNER_TEMP/zerglang-updater.pub" \
            -x "$RUNNER_TEMP/zerglang-updater.minisig"
          CANONICAL="$canonical" node --input-type=module <<'NODE'
          import { extractSourceApplication } from "./release-repository/scripts/package-macos.mjs";
          const result = await extractSourceApplication({
            archivePath: process.env.CANONICAL + "/ZergLang.app.tar.gz",
            outputDirectory: process.env.RUNNER_TEMP + "/zerglang-canonical-app",
            maxArchiveBytes: 536_870_912,
            maxEntryCount: 16_384,
            maxFileBytes: 536_870_912,
            maxUncompressedBytes: 2_147_483_648,
          });
          if (result.entryCount < 2 || result.uncompressedBytes < 1) throw new Error("empty app archive");
          NODE

      - name: Upload canonical verified release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerglang-canonical-release
          path: ${{ runner.temp }}/zerglang-canonical-release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  feed:
    name: Promote canonical bytes on release-data
    needs:
      - validate
      - publish
    runs-on: ubuntu-24.04
    environment: zerglang-feed
    permissions:
      contents: read
    env:
      CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      REQUEST_COMMIT: ${{ needs.validate.outputs.request_commit }}
      REQUEST_PATH: ${{ needs.validate.outputs.request_path }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: policy
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: policy/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zerglang-canonical-release
          path: canonical
      - name: Revalidate request, tag, immutable release, and canonical controls
        working-directory: policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node scripts/release-request.mjs "$REQUEST_PATH" >/dev/null
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "$REQUEST_COMMIT" ]]
          release_json="$RUNNER_TEMP/zerglang-feed-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$release_json"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .immutable == true
             and (.assets | length) == 6' "$release_json" >/dev/null
          [[ "$(find ../canonical -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 6 ]]
          if find ../canonical -mindepth 1 -maxdepth 1 \! -type f -print -quit | grep -q .; then
            echo "::error::canonical artifact contains a non-regular entry"
            exit 1
          fi
          (cd ../canonical && sha256sum -c checksums.txt)
          jq -e --arg version "$VERSION" --arg channel "$CHANNEL" \
            '.version == $version and .channel == $channel' \
            ../canonical/release-metadata.json >/dev/null
          jq -e --arg version "$VERSION" '.version == $version' \
            ../canonical/latest.json >/dev/null

      - name: Clone release-data and prepare strict SSH host keys without credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch release-data --single-branch --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" data
          [[ "$(git -C data symbolic-ref --short HEAD)" == "release-data" ]]
          known_hosts="$RUNNER_TEMP/zerglang-feed-known-hosts"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://api.github.com/meta \
            | jq -er '.ssh_keys[] | select(startswith("ssh-ed25519 ")) | "github.com " + .' \
            >"$known_hosts"
          chmod 600 "$known_hosts"
          ssh-keygen -F github.com -f "$known_hosts" >/dev/null

      - name: Prepare the monotonic release-data commit
        shell: bash
        run: |
          set -euo pipefail
          node policy/scripts/feed-promotion.mjs prepare \
            data canonical "$CHANNEL" "$VERSION" "$RELEASE_TAG" \
            | tee "$RUNNER_TEMP/zerglang-feed-prepared.json"
          jq -e --arg channel "$CHANNEL" --arg version "$VERSION" \
            '.status == "committed" or .status == "unchanged"' \
            "$RUNNER_TEMP/zerglang-feed-prepared.json" >/dev/null
          cmp canonical/latest.json "data/site/$CHANNEL/latest.json"
          cmp canonical/release-metadata.json \
            "data/site/$CHANNEL/releases/$VERSION.json"

      - name: Push only the prepared release-data commit
        env:
          FEED_DEPLOY_KEY: ${{ secrets.ZERGLANG_FEED_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FEED_DEPLOY_KEY" ]] || {
            echo "::error::ZERGLANG_FEED_DEPLOY_KEY is unavailable"
            exit 1
          }
          key_path="$RUNNER_TEMP/zerglang-feed-deploy-key"
          known_hosts="$RUNNER_TEMP/zerglang-feed-known-hosts"
          cleanup() {
            rm -f "$key_path"
          }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$FEED_DEPLOY_KEY" >"$key_path"
          unset FEED_DEPLOY_KEY
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          expected_parent="$(jq -er '.parent | select(test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/zerglang-feed-prepared.json")"
          node policy/scripts/feed-promotion.mjs push \
            data "git@github.com:${GITHUB_REPOSITORY}.git" release-data \
            "$expected_parent"

      - name: Validate the deterministic Pages tree
        shell: bash
        run: |
          set -euo pipefail
          if find data/site \! -type f \! -type d -print -quit | grep -q .; then
            echo "::error::Pages site contains a symlink or special file"
            exit 1
          fi
          git -C data diff --exit-code
          git -C data diff --cached --exit-code

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: data/site

  deploy_pages:
    name: Deploy verified updater site
    needs: feed
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify_live:
    name: Compare the live HTTPS updater feed with canonical bytes
    needs:
      - validate
      - deploy_pages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CHANNEL: ${{ needs.validate.outputs.channel }}
      PAGE_URL: ${{ needs.deploy_pages.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zerglang-canonical-release
          path: canonical
      - name: Require byte-identical live latest.json over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          expected_origin="https://epoch-ml.github.io/zerglang-releases"
          page_origin="${PAGE_URL%/}"
          [[ "$page_origin" == "$expected_origin" ]] || {
            echo "::error::Pages deployed to unexpected origin: $page_origin"
            exit 1
          }
          live="$RUNNER_TEMP/zerglang-live-latest.json"
          url="$expected_origin/$CHANNEL/latest.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --max-filesize 1048576 --output "$live" "$url" \
              && cmp canonical/latest.json "$live"; then
              exit 0
            fi
            [[ "$attempt" -lt 30 ]] || break
            sleep 10
          done
          echo "::error::live Pages latest.json never matched canonical release bytes"
          exit 1
