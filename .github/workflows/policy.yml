name: Release policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Test every public release policy
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=moderate
          npm test
          node scripts/workflow-policy.mjs .github/workflows/release.yml
          node scripts/workflow-policy.mjs .github/workflows/policy.yml --policy-ci
          actionlint_archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-filesize 10485760 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$actionlint_archive" \
            | sha256sum -c -
          tar -xzf "$actionlint_archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
          git diff --check
